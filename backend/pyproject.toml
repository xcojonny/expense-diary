[project]
name = "expense-diary"
version = "2.0.0"
description = "Selbst gehostetes Haushaltsbuch: Kassenbon fotografieren, Ausgaben und Preistrends auswerten."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pypdf>=5.1",
    "pillow>=11.0",
    # iPhones teilen HEIC; ohne dieses Plugin kann Pillow es nicht öffnen und
    # ein Foto aus dem Kurzbefehl käme nie beim Modell an.
    "pillow-heif>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",   # FastAPI-Idiom: Depends()/File() als Default-Argument
    # Der Code ist deutsch kommentiert: „typografische Anführungszeichen“, Bindestriche
    # und das echte × (so steht es auf Kassenbons) sind Absicht, keine Verwechslung.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "PIL.*", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
