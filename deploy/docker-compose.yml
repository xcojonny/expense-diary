# Production app stack: db + redis + migrate (one-shot) + backend + worker + frontend.
# Configuration comes entirely from .env (template: .env.example).
#
# Ingress is via Traefik (labels below), joining the homelab's existing external
# `proxy` network. Traefik routes on the public host ${APP_HOST}:
#   /api/, /media  -> backend:8000   (router expense-api)
#   everything else -> frontend:8080 (router expense-app)
# No host ports are published — Traefik reaches the containers over the proxy net.

name: expense-diary

x-backend-image: &backend-image
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/expense-diary-backend:${IMAGE_TAG:-latest}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-expense}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: apply migrations and seed master data, then exit.
  migrate:
    <<: *backend-image
    command: sh -c "alembic upgrade head && python -m app.seed"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  backend:
    <<: *backend-image
    env_file: .env
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.expense-api.rule=Host(`${APP_HOST:?set APP_HOST}`) && (PathPrefix(`/api/`) || PathPrefix(`/media`))
      - traefik.http.routers.expense-api.entrypoints=websecure
      - traefik.http.routers.expense-api.tls=true
      # - traefik.http.routers.expense-api.tls.certresolver=letsencrypt
      - "traefik.http.routers.expense-api.service=expense-api"
      - traefik.http.services.expense-api.loadbalancer.server.port=8000
      - "traefik.http.routers.expense-api.middlewares=default@file"
    restart: unless-stopped

  # ARQ worker for the async receipt-extraction pipeline.
  worker:
    <<: *backend-image
    command: arq app.workers.settings.WorkerSettings
    env_file: .env
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/expense-diary-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.expense-app.rule=Host(`${APP_HOST:?set APP_HOST}`)
      - traefik.http.routers.expense-app.entrypoints=websecure
      - traefik.http.routers.expense-app.tls=true
      # - traefik.http.routers.expense-app.tls.certresolver=letsencrypt
      - "traefik.http.routers.expense-app.service=expense-app"
      - traefik.http.services.expense-app.loadbalancer.server.port=8080
      - "traefik.http.routers.expense-app.middlewares=default@file"
    restart: unless-stopped

networks:
  internal:
  proxy:
    external: true  # the homelab's existing Traefik network

volumes:
  db-data:
  redis-data:
  media:
