name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Läuft ein neuer Commit auf demselben Branch, bricht der alte Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy app

      # Kein Service-Container: die Tests laufen gegen eine temporäre
      # SQLite-Datei (ADR-010). Der Altstand brauchte hier Postgres UND Redis.
      - name: pytest
        run: uv run pytest

      - name: Migrationen prüfen (upgrade → downgrade → upgrade)
        env:
          DATA_DIR: ${{ runner.temp }}/migrationcheck
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend (eslint · vue-tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: vue-tsc
        run: pnpm typecheck

      - name: vitest
        run: pnpm test

      - name: Build
        run: pnpm run build:only

  image:
    name: Docker-Image baut
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Nur bauen, nicht pushen: dass ein Image entsteht, ist die Aussage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
