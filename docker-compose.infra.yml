# Deploy webhook (pull-based). Runs alongside the app stack; GitHub Actions
# (release.yml → deploy job) POSTs an HMAC-signed {sha,timestamp} to it, and it
# runs `docker compose pull && up -d --wait` in the app directory.
#
# Put this behind your reverse proxy with TLS and expose only /hooks/deploy.
# Shares the root .env (DEPLOY_WEBHOOK_SECRET must match the GitHub secret).
#
# Security note: this mounts the Docker socket, which is powerful. For stricter
# setups, front it with tecnativa/docker-socket-proxy and set DOCKER_HOST.

name: expense-infra

services:
  webhook:
    build: ./webhook
    environment:
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:?set DEPLOY_WEBHOOK_SECRET}
      COMPOSE_DIR: /srv/expense
      NTFY_URL: ${NTFY_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The app stack directory (contains docker-compose.yml + .env).
      - ${APP_DEPLOY_DIR:?set APP_DEPLOY_DIR}:/srv/expense
    ports:
      - "${WEBHOOK_PORT:-9000}:9000"
    restart: unless-stopped
