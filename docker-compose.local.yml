# Local override for docker-compose.yml — run the PRODUCTION stack on your
# machine: build the app images from source (instead of pulling GHCR) and
# publish host ports (no Traefik locally). The webhook + socket-proxy are simply
# not started (the Makefile targets list only the app services).
#
# Usage (or just `make prod-up`):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build \
#     db redis migrate backend worker frontend
#
# Note: with APP_ENV=production the refresh cookie needs HTTPS — set
# COOKIE_SECURE=false in .env if you want to test login over http://localhost.

# Only `backend` carries the build for the shared backend image; migrate + worker
# reference the same image: tag and reuse the built image (declaring build: on
# all three makes `up --build` build the identical tag 3× → BuildKit "already
# exists"). `make build` builds backend + frontend; migrate/worker inherit it.
services:
  backend:
    build: ./backend
    ports:
      - "${LOCAL_API_PORT:-8000}:8000"
  frontend:
    build: ./frontend
    ports:
      - "${LOCAL_WEB_PORT:-8080}:8080"
