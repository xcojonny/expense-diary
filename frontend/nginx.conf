server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy nginx only sees its internal port — don't let its
    # automatic directory redirect leak :8080 into the Location header.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build assets: cache aggressively.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker: never cache, or a deploy freezes on the old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback. /api and /media are routed to the backend by the reverse
    # proxy, not nginx. no-cache forces revalidation of index.html so a deploy
    # never pins stale /_nuxt/ hashes.
    #
    # Deliberately no `$uri/`: the static build emits per-route directories
    # (e.g. login/index.html), and `$uri/` would make nginx 301 `/login` →
    # `/login/`. Vue Router keeps that trailing slash, the auth guard then
    # bounces the visitor and strips the magic-link ?token → login loop. Serving
    # the shell directly keeps the URL canonical so the token is redeemed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
